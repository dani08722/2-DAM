<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis notas rápidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <main class="col-12 px-md-4">
                <div class="d-flex justify-content-between flex-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Mis notas rápidas</h1>
                    <button type="button" class="btn btn-primary" id="anadirNota" data-bs-toggle="modal"
                        data-bs-target="#modalNota">Añadir nota</button>
                </div>

                <div class="row g-3" id="contenedorNotas"></div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalNota" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="tituloModal">Crear o editar nota</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formNota">
                        <div class="mb-3">
                            <label for="tituloNota" class="form-label">Título de la nota</label>
                            <input type="text" class="form-control" id="tituloNota" placeholder="Escribe el título">
                        </div>
                        <div class="mb-3">
                            <label for="anchoNota" class="form-label">Tamaño de la nota</label>
                            <select class="form-select" id="anchoNota">
                                <option value="2">Pequeño</option>
                                <option value="4" selected>Mediano</option>
                                <option value="6">Grande</option>
                            </select>
                        </div>
                        <div>
                            <label for="colorNota" class="form-label">Color de la nota</label>
                            <select class="form-select" id="colorNota">
                                <option value="danger">Roja</option>
                                <option value="success">Verde</option>
                                <option value="primary">Azul</option>
                                <option value="warning">Amarilla</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="guardarNota" data-bs-dismiss="modal">Guardar nota</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="prueba.js"></script>
</body>
</html>
