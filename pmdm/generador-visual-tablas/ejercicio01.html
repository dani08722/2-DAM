<!--
Se pide hacer un generador visual de tablas HTML, haciendo uso de HTML, 
Bootstrap CSS, y JavaScript con jQuery. Deberán programarse los controles necesarios para:

- Añadir nueva fila a la tabla
- Eliminar cualquier fila de la tabla
- Añadir columna
- Eliminar columna
- Eliminar tabla completa


EXTRA

Que haya un asistente inicial que te pregunte de cuántas filas  y columnas quieres generar la tabla.
-->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador visual de tablas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>



  </style>

</head>
<body class="container py-4">
    <table id="tabla-ejemplo" class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Curso</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Dani</td>
                <td>20</td>
                <td>PMDM</td>
                <td>Activo</td>
            </tr>
            <tr>
                <td>Pepe</td>
                <td>22</td>
                <td>DAW</td>
                <td>Activo</td>
            </tr>
            <tr>
                <td>Pedro</td>
                <td>19</td>
                <td>SMR</td>
                <td>Inactivo</td>
            </tr>
            <tr>
                <td>Hugo</td>
                <td>21</td>
                <td>PMDM</td>
                <td>Activo</td>
            </tr>
        </tbody>
    </table>

    <button id="anadir-fila" class="btn btn-primary">Añadir fila</button>
    <button id="anadir-columna" class="btn btn-primary">Añadir columna</button>
    <button id="eliminar-fila" class="btn btn-danger">Eliminar fila</button>
    <button id="eliminar-columna" class="btn btn-danger">Eliminar columna</button>
    <button id="eliminar-tabla" class="btn btn-danger">Eliminar tabla</button>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="ejercicio01.js"></script>
</body>
</html>
