<div class="modal-header">
    <h4 class="modal-title">{{ peopleDetail?.name }}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
    <p>Altura: {{ peopleDetail?.height }} cm</p>
    <p>Peso: {{ peopleDetail?.mass }} kg</p>
    <p>Género: {{ peopleDetail?.gender }}</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close()">Close</button>
</div>
