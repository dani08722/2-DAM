<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pokédex - Made by dani</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header><h1>Mi Pokédex</h1></header>
  <main>
    <section id="detalle" class="detalle" hidden>
      <button id="volver">Volver a la lista</button>
      <div id="informacion"></div>
    </section>
    <h2>Lista de Pokémon</h2>
    <input type="text" id="buscador" placeholder="Buscar Pokémon...">
    <p id="mensaje">Cargando Pokémon...</p>
    <section id="lista" class="lista"></section>
    
  </main>
  <footer>Datos de <a href="https://pokeapi.co/">PokéAPI</a></footer>
  <script src="script.js"></script>
</body>
</html>
