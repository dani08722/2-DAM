<div class="form-field">
<label for="fieldText" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="fieldText" placeholder="Nombre" [(ngModel)]="nombreForm">

<label for="fieldText" class="form-label">Apellidos</label>
    <input type="text" class="form-control" id="fieldText" placeholder="Apellidos" [(ngModel)]="apellidosForm">

<label for="fieldText" class="form-label">NIF</label>
    <input type="text" class="form-control" id="fieldText" placeholder="NIF" [(ngModel)]="nifForm">

<label for="fieldText" class="form-label">Email</label>
    <input type="text" class="form-control" id="fieldText" placeholder="Email" [(ngModel)]="emailForm">

<label for="fieldText" class="form-label">Teléfono</label>
    <input type="text" class="form-control" id="fieldText" placeholder="Teléfono" [(ngModel)]="telefonoForm">

<label for="fieldText" class="form-label">Sexo</label>
    <select class="form-select" [(ngModel)]="sexoForm">
        <option value="Hombre">Hombre</option>
        <option value="Mujer">Mujer</option>
    </select>

<label for="fieldText" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="fieldText" placeholder="Contraseña" [(ngModel)]="passwordForm">
<label for="fieldText" class="form-label">Confirmar Contraseña</label>
    <input type="password" class="form-control" id="fieldText" placeholder="Confirmar Contraseña" [(ngModel)]="passwordConfirmForm">
</div>

<button type="button" (click)="sendForm()" class="theme-primary btn-solid btn-styled">
    Enviar formulario
</button>
